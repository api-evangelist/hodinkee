name: HODINKEE well-known document probe
description: >-
  Probe of /.well-known/ across every Hodinkee host resolved on 2026-08-22.
  The editorial site (www.hodinkee.com) and the insurance site
  (insurance.hodinkee.com) serve nothing under /.well-known/. The commerce host
  (shop.hodinkee.com) serves a full RFC 8414 / OpenID / RFC 9728 set plus a
  Universal Commerce Protocol merchant profile, because the store runs on
  Shopify and Shopify emits these per store. The documents are served from a
  host Hodinkee controls and describe Hodinkee's own shop
  (resource https://shop.hodinkee.com, Shopify shop id 1460732,
  merchant_name "HODINKEE Shop"), so they are recorded here as Hodinkee's
  surface, with platform attribution noted on every entry.
platform_attribution: >-
  Shopify authors the document templates; Hodinkee operates the store and the
  host. This is the same relationship as a self-hosted {site}/wp-json surface:
  the schema belongs to the platform, the endpoint and the data belong to the
  provider.
hosts:
