apis:
- name: HODINKEE Shop Agent Commerce (UCP / MCP)
  description: >-
    The agent-callable commerce surface of HODINKEE Shop. Two Model Context
    Protocol endpoints are served from shop.hodinkee.com and answered a real
    tools/list anonymously on 2026-08-22: /api/ucp/mcp implements the Universal
    Commerce Protocol shopping service (13 tools across catalog, cart, checkout
    and order) and /api/mcp is Shopify's narrower storefront tool set (5 tools).
    Discovery is at /.well-known/ucp, agent instructions at /llms.txt and
    /agents.md. The tool schemas are authored by Shopify and templated per
    store; the host, the shop (Shopify shop id 1460732, "HODINKEE Shop") and the
    catalog the tools return are Hodinkee's.
  humanURL: https://shop.hodinkee.com/agents.md
  baseURL: https://shop.hodinkee.com
