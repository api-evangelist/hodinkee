aid: hodinkee
name: Hodinkee
description: >-
  Hodinkee is a New York-based watch media and e-commerce company founded in
  2008, publishing editorial, video and its print Magazine at www.hodinkee.com
  and selling new and pre-owned watches, straps and accessories through HODINKEE
  Shop at shop.hodinkee.com. It was acquired by the Watches of Switzerland Group
  in October 2024. Hodinkee runs no developer program and publishes no OpenAPI,
  developer portal or API reference. Its one machine-readable integration
  surface is agentic commerce: the Shopify-hosted store serves a Universal
  Commerce Protocol merchant profile at /.well-known/ucp and two live,
  anonymously callable MCP endpoints for catalog search, cart and checkout,
  advertised from the store's own robots.txt and llms.txt.
