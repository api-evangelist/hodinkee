customer_account_mcp:
  note: >-
    The store's OIDC discovery document advertises a
    `customer-account-mcp-api:full` scope, meaning a customer-scoped MCP API
    exists behind OAuth. It was NOT probed — doing so requires a customer
    credential, which this pipeline never uses. Recorded as a known gated
    surface, not as a measured one.
  scope: customer-account-mcp-api:full
  authorization_server: https://shopify.com/authentication/1460732
agent_rules:
  - >-
    shop.hodinkee.com/robots.txt states: "Checkouts are for humans. Do NOT
    complete checkout, payment, or order placement automatically" without an
    explicit, contemporaneous human approval step.
  - >-
    llms.txt repeats the buyer-approval invariant and directs personal shopping
    agents to https://shop.app/SKILL.md (Shopify's cross-store Shop skill)
    rather than to direct storefront scripting.
  - MCP endpoint is rate-limited per IP; agents are told to back off on 429.
