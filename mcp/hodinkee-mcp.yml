method: probed
source: https://shop.hodinkee.com/api/ucp/mcp
name: HODINKEE Shop MCP
description: >-
  HODINKEE Shop (shop.hodinkee.com) exposes two live, anonymously reachable
  Model Context Protocol endpoints. Both answered a real JSON-RPC tools/list on
  2026-08-22 with full inputSchema payloads — no OAuth challenge, no
  invalid_token. The UCP endpoint implements the Universal Commerce Protocol
  shopping service (catalog, cart, checkout, order); the storefront endpoint is
  Shopify's narrower conversational-commerce tool set.
ownership: >-
  Platform-provided, provider-operated. Shopify authors the tool schemas and
  serves them for every store; Hodinkee owns the host, the shop
  (Shopify shop id 1460732, merchant_name "HODINKEE Shop"), and the catalog the
  tools return. The endpoints are advertised by Hodinkee's own
  shop.hodinkee.com/robots.txt and /llms.txt. Recorded on the same basis the
  pipeline records a self-hosted {site}/wp-json surface: the contract is the
  platform's, the endpoint and the data are the provider's. It is NOT recorded
  as a contract Hodinkee authored.
deployment:
  mode: remote
  endpoint: https://shop.hodinkee.com/api/ucp/mcp
  auth: none
  verified: probed
status: live
